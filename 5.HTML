<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <H1>javascript events</H1>
    <h2>the mouse position event</h2>
    <p id="demo"></p>
    <script>
        document.addEventListener("mousemove", function(event) {
            document.getElementById("demo").innerHTML = "mouse position: " + event.clientX + ", " + event.clientY;
        });
    </script>
</body>
</html>
